name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # bun.lock is lockfileVersion 2, which only bun >=1.4 (canary) writes/reads;
          # stable "latest" (1.3.14) can't parse it. Track canary to match the lockfile.
          # (An exact canary build isn't pinnable — bun ships only a rolling `canary` tag.)
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests (100% coverage gate)
        run: bun run test:coverage

      - name: Build extension
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run e2e
